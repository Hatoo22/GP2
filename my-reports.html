<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('diraThemeChoice')!=='light')document.documentElement.classList.add('dark-pre')}catch(e){}</script>
  <style>html.dark-pre{background:#0d0d0c;color-scheme:dark}</style>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Complaints | DIR'A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="style.css?v=62">
</head>

<body class="fullPage">
      <script>if(document.documentElement.classList.contains('dark-pre'))document.body.classList.add('dark-mode')</script>
<main class="page">

        <!-- Navbar -->
        <nav class="nav">
            <a href="main-home.html" class="logo logo-switch">
  <img src="images/black-logo.png" class="logo-light">
  <img src="images/white-logo.png" class="logo-dark">
</a>
            <div class="links">
                <a href="home.html">Home</a>
                <a href="games.html">Games</a>
                <a class="active" href="my-reports.html">Complaints</a>
                <a href="tracked-games.html">My List</a>
                <a class="btn" href="main-home.html">Log Out</a>
                <button onclick="toggleTheme()" class="icon">🌙</button>
                <a class="icon profileIcon" href="profile.html">👤</a>
            </div>
        </nav>

        <!-- Content -->
        <section class="section adminDash agPage mcPage">

            <div class="dsh-head">
                <div>
                    <h1>My Complaints</h1>
                    <p class="mini">Follow what happens to every complaint you send.</p>
                </div>
                <a class="btn" href="games.html" title="Choose a game, then press Report on its page">+ New complaint</a>
            </div>

            <div class="mc-updates" id="mcUpdates" hidden></div>

            <div class="ag-tabs" id="mcTabs" role="tablist">
                <button class="ag-tab is-active" data-status="all" type="button">All <span id="mcAll">0</span></button>
                <button class="ag-tab" data-status="Pending" type="button"><i style="--c:#f59e0b"></i>Pending <span id="mcPending">0</span></button>
                <button class="ag-tab" data-status="Reviewing" type="button"><i style="--c:#3b82f6"></i>Reviewing <span id="mcReviewing">0</span></button>
                <button class="ag-tab" data-status="Resolved" type="button"><i style="--c:#22c55e"></i>Resolved <span id="mcResolved">0</span></button>
            </div>

            <div class="mc-list" id="mcList">
                <p class="mc-empty">Loading your complaints…</p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <h3 class="footer-logo logo-switch">
  <img src="images/black-logo.png" alt="Dir Logo" class="logo-light">
  <img src="images/white-logo.png" alt="Dir Logo" class="logo-dark">
</h3>
            
            <p class="mini">
  <a href="about.html">About Us</a>
</p>
        </footer>

    </main>

    <script src="js/common.js?v=17"></script>
    <script src="js/my-reports.js?v=31"></script>

</body>

</html>
