<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('diraTheme')==='dark')document.documentElement.classList.add('dark-pre')}catch(e){}</script>
  <style>html.dark-pre{background:#0d0d0c;color-scheme:dark}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suggestions | DIR'A Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css?v=59">
  <style>html.admin-checking body{visibility:hidden}</style>
  <script src="js/admin-guard.js"></script>
</head>


<body class="fullPage">

    <script>if(document.documentElement.classList.contains('dark-pre'))document.body.classList.add('dark-mode')</script>
<main class="page">


    <!-- =========================
         NAV
    ========================== -->

    <nav class="nav">

      <a href="admin-dashboard.html" class="logo logo-switch">

        <img
          src="images/black-logo.png"
          class="logo-light"
          alt="DIR'A Logo"
        >

        <img
          src="images/white-logo.png"
          class="logo-dark"
          alt="DIR'A Logo"
        >

      </a>


      <div class="links">

        <a href="admin-dashboard.html">
          Dashboard
        </a>

        <a href="admin-games.html">
          Games
        </a>

        <a href="admin-users.html">
          Users
        </a>

        <a href="admin-complaints.html">Complaints</a>
        <a href="admin-suggestions.html" class="active">Suggestions</a>

        <a
          class="btn"
          href="main-home.html"
        >
          Log Out
        </a>

        <button
          onclick="toggleTheme()"
          class="icon"
          type="button"
        >
          🌙
        </button>

        <a class="icon profileIcon" href="profile.html" aria-label="My profile">👤</a>

      </div>

    </nav>



    <!-- =========================
         COMPLAINTS MANAGEMENT
    ========================== -->
    <section class="section adminDash agPage auPage sgPage">

      <div class="dsh-head">
        <div>
          <p class="dsh-eyebrow">ADMIN / SUGGESTIONS</p>
          <h1>Suggestions</h1>
          <p class="mini">Games and ideas users sent through the Dir'a Assistant.</p>
        </div>
      </div>

      <div class="ag-tabs" id="sgTabs" role="tablist">
        <button class="ag-tab is-active" data-type="all" type="button">All <span id="cntAll">0</span></button>
        <button class="ag-tab" data-type="game_suggestion" type="button"><i style="--c:#32c5d2"></i>Game suggestions <span id="cntGame">0</span></button>
        <button class="ag-tab" data-type="general_suggestion" type="button"><i style="--c:#a855f7"></i>Ideas to improve <span id="cntIdea">0</span></button>
      </div>

      <article class="dsh-card ag-card">
        <div class="ag-toolbar">
          <div class="ag-search">
            <input type="text" id="sgSearch" placeholder="Search by text or user..." autocomplete="off">
          </div>
          <div class="au-status" id="sgRead" role="group" aria-label="Filter by read status">
            <button type="button" class="is-active" data-read="all">All</button>
            <button type="button" data-read="new"><i style="--c:#ef4444"></i>Unread <span id="cntNew">0</span></button>
            <button type="button" data-read="read"><i style="--c:#94a3b8"></i>Read</button>
          </div>
          <button type="button" class="au-btn" id="sgMarkAll">Mark all as read</button>
        </div>

        <ul class="sg-list" id="sgList">
          <li class="dsh-empty">Loading suggestions…</li>
        </ul>
      </article>
    </section>

</main>


  <script src="js/common.js?v=13"></script>
  <script src="js/admin-suggestions.js?v=30"></script>

</body>

</html>
