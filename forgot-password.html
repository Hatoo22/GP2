<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <script>try{if(localStorage.getItem('diraTheme')==='dark')document.documentElement.classList.add('dark-pre')}catch(e){}</script>
  <style>html.dark-pre{background:#0d0d0c;color-scheme:dark}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot password | DIR’A</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css?v=42">
  <link rel="stylesheet" href="guardian.css?v=7">

</head>


<body class="authPage authLoginPage">


    <script>if(document.documentElement.classList.contains('dark-pre'))document.body.classList.add('dark-mode')</script>
<!-- BACKGROUND -->
  <div class="authBackdrop" aria-hidden="true">

    <div class="authGlow authGlowOne"></div>

    <div class="authGlow authGlowTwo"></div>

    <div class="authGrid"></div>

  </div>



  <main class="authShell">


    <!-- NAV -->
    <nav class="authNav">

      <a
        href="main-home.html"
        class="logo logo-switch authLogo"
        aria-label="DIR’A home"
      >

        <img
          src="images/black-logo.png"
          class="logo-light"
          alt="DIR’A"
        >

        <img
          src="images/white-logo.png"
          class="logo-dark"
          alt="DIR’A"
        >

      </a>


      <div class="authNavActions">

        <button
          onclick="toggleTheme()"
          class="icon authTheme"
          aria-label="Switch theme"
        >
          🌙
        </button>

      </div>

    </nav>



    <!-- FORGOT PASSWORD -->
    <section class="authStage authStageLogin">
      <div class="authContent authLoginContent">

        <h1 class="authTitle">
          Forgot your<br>
          <em>password?</em>
        </h1>

        <p class="authLead">
          Enter the email you use for Dir'a and we'll send you a link to set a new password.
        </p>

        <form id="forgotForm" class="authForm authLoginForm" novalidate>
          <div id="forgotMessage" class="formMessage authMessage" hidden></div>

          <div class="field">
            <label for="forgotEmail">Email</label>
            <input id="forgotEmail" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
          </div>

          <button id="forgotBtn" class="btn light authSubmit" type="submit">
            Send reset link <span>→</span>
          </button>

          <p class="authSwitchText">
            Remembered it?
            <a href="login.html">Back to log in</a>
          </p>
        </form>

      </div>
    </section>

  </main>



  <!-- DIR'A GUARDIAN -->
  <div
    id="dirGuardian"
    class="dir-guardian auth-dir-guardian"
    aria-hidden="true"
  >

    <div
      class="guardian-symbol"
      id="guardianSymbol"
    ></div>


    <div class="guardian-body-wrap">

      <div class="guardian-shadow"></div>

      <div class="guardian-neck"></div>


      <div class="guardian-head-wrap">

        <div class="guardian-head">

          <div class="guardian-ear guardian-ear-left"></div>

          <div class="guardian-ear guardian-ear-right"></div>


          <div class="guardian-face">

            <span class="guardian-eye guardian-eye-left"></span>

            <span class="guardian-eye guardian-eye-right"></span>

          </div>

        </div>

      </div>


      <div class="guardian-body"></div>

      <div class="guardian-arm guardian-arm-left"></div>

      <div class="guardian-arm guardian-arm-right"></div>

    </div>

  </div>



  <script src="js/common.js?v=9"></script>

  <script src="js/guardian.js"></script>

  <script src="js/forgot-password.js"></script>

</body>

</html>
