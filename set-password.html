<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <script>try{if(localStorage.getItem('diraThemeChoice')!=='light')document.documentElement.classList.add('dark-pre')}catch(e){}</script>
  <style>html.dark-pre{background:#0d0d0c;color-scheme:dark}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Set password | DIR’A</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css?v=70">
  <link rel="stylesheet" href="guardian.css?v=7">

  <script src="js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="rtl.css?v=1">
</head>


<body class="authPage authLoginPage">


    <script>if(document.documentElement.classList.contains('dark-pre'))document.body.classList.add('dark-mode')</script>
<!-- BACKGROUND -->
  <div class="authBackdrop" aria-hidden="true">

    <div class="authGlow authGlowOne"></div>

    <div class="authGlow authGlowTwo"></div>

    <div class="authGrid"></div>

  </div>



  <main class="authShell">


    <!-- NAV -->
    <nav class="authNav">

      <a
        href="main-home.html"
        class="logo logo-switch authLogo"
        aria-label="DIR’A home"
      >

        <img
          src="images/black-logo.png"
          class="logo-light"
          alt="DIR’A"
        >

        <img
          src="images/white-logo.png"
          class="logo-dark"
          alt="DIR’A"
        >

      </a>


      <div class="authNavActions">

        <button
          onclick="toggleTheme()"
          class="icon authTheme"
          aria-label="Switch theme"
        >
          🌙
        </button>

      </div>

    </nav>



    <!-- SET PASSWORD -->
    <section class="authStage authStageLogin">
      <div class="authContent authLoginContent">

        <h1 class="authTitle" id="spTitle">
          Set a new<br>
          <em>password.</em>
        </h1>

        <p class="authLead" id="spLead">Checking your link…</p>

        <form id="setForm" class="authForm authLoginForm" novalidate hidden>
          <div id="setMessage" class="formMessage authMessage" hidden></div>

          <div class="field">
            <label for="spEmail">Email</label>
            <input id="spEmail" type="email" readonly>
          </div>

          <div class="field" id="spNameField" hidden>
            <label for="spName">Full name</label>
            <input id="spName" type="text" placeholder="Your full name" autocomplete="name" maxlength="100">
          </div>

          <div class="field">
            <label for="spPassword">New password</label>
            <input id="spPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
            <p class="mini sp-hint">Use at least 8 characters with letters and numbers.</p>
          </div>

          <div class="field">
            <label for="spConfirm">Confirm password</label>
            <input id="spConfirm" type="password" placeholder="Type it again" autocomplete="new-password" required>
          </div>

          <button id="setBtn" class="btn light authSubmit" type="submit">
            Save password <span>→</span>
          </button>
        </form>

        <div id="spDone" class="sp-done" hidden>
          <div id="spDoneMessage" class="formMessage authMessage"></div>
          <a class="btn light authSubmit" id="spDoneLink" href="login.html">Go to log in <span>→</span></a>
        </div>

      </div>
    </section>

  </main>



  <!-- DIR'A GUARDIAN -->
  <div
    id="dirGuardian"
    class="dir-guardian auth-dir-guardian"
    aria-hidden="true"
  >

    <div
      class="guardian-symbol"
      id="guardianSymbol"
    ></div>


    <div class="guardian-body-wrap">

      <div class="guardian-shadow"></div>

      <div class="guardian-neck"></div>


      <div class="guardian-head-wrap">

        <div class="guardian-head">

          <div class="guardian-ear guardian-ear-left"></div>

          <div class="guardian-ear guardian-ear-right"></div>


          <div class="guardian-face">

            <span class="guardian-eye guardian-eye-left"></span>

            <span class="guardian-eye guardian-eye-right"></span>

          </div>

        </div>

      </div>


      <div class="guardian-body"></div>

      <div class="guardian-arm guardian-arm-left"></div>

      <div class="guardian-arm guardian-arm-right"></div>

    </div>

  </div>



  <script src="js/common.js?v=18"></script>

  <script src="js/guardian.js"></script>

  <script src="js/set-password.js"></script>

  <script src="js/password-eye.js"></script>
</body>

</html>
